kind = "web"
  previewPath = "/"
  title = "GymPro"
  version = "1.0.0"
  id = "gymPro5000PythonStreamlit"

  [[services]]
  localPort = 5000
  name = "Start application"
  paths = ["/"]

  [services.development]
  run = "cd /home/runner/workspace/gym-app && /home/runner/workspace/.pythonlibs/bin/python run.py"

  [services.production]
  run = "cd /home/runner/workspace/gym-app && PYTHONPATH=/home/runner/workspace/.pythonlibs/lib/python3.11/site-packages /home/runner/workspace/.pythonlibs/bin/python -m streamlit run app.py --server.port 5000 --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false --server.fileWatcherType none"

  [services.production.health.startup]
  path = "/_stcore/health"
